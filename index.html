<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ines's Developer Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header><a href="https://github.com/ineskarlina15">← GitHub Profile</a><span class="pill">DEVELOPER ARCADE</span></header>
  <h1>Play. Learn. Build. <span>🎮</span></h1>
  <p class="subtitle">Two classic games, built with vanilla JavaScript.</p>
  <div class="tabs"><button id="snakeTab" class="active">🐍 Snake</button><button id="pacTab">🟡 Pac-Man</button></div>
  <section class="gamebox">
    <div class="status"><span id="mode">SNAKE</span><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></div>
    <canvas id="game" width="480" height="480" aria-label="Game board"></canvas>
    <p id="message" role="status">Press Start to play</p>
    <div class="buttons"><button id="start">Start / Restart</button><button id="pause">Pause</button></div>
    <div class="dpad"><button data-dir="up" aria-label="Up">↑</button><div><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div></div>
    <p class="hint">Use arrow keys / WASD or touch controls. Space = pause.</p>
  </section>
  <footer>Made with HTML, CSS & JavaScript · <a href="https://github.com/ineskarlina15">Ines Karlina</a></footer>
</main>
<script src="game.js"></script>
</body>
</html>
