
name: Generate Contribution Animations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ineskarlina15
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man Animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ineskarlina15

      - name: Collect Pac-Man Output
        run: |
          mkdir -p dist
          if [ -f dist/pacman-contribution-graph-dark.svg ]; then
            echo "Pac-Man output already in dist"
          elif [ -f pacman-contribution-graph-dark.svg ]; then
            cp pacman-contribution-graph-dark.svg dist/
          else
            echo "Pac-Man SVG not found"
            exit 1
          fi

      - name: Publish Animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
